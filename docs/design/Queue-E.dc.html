<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Queue corner pill</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.t-dark{--glow:rgba(76,195,138,.55)}.t-light{--glow:rgba(27,115,70,.45)}
@keyframes qglow{0%{box-shadow:0 0 0 0 var(--glow),0 0 0 0 var(--glow),0 6px 20px rgba(0,0,0,.35)}18%{box-shadow:0 0 0 5px var(--glow),0 0 26px 6px var(--glow),0 6px 20px rgba(0,0,0,.35)}100%{box-shadow:0 0 0 12px transparent,0 0 30px 0 transparent,0 6px 20px rgba(0,0,0,.35)}}
.q-glow{animation:qglow 1.6s ease-out 0s 1 both}
.q-glow.loop{animation:qglow 1.6s ease-out 0s infinite}
@media (prefers-reduced-motion: reduce){.q-glow,.q-glow.loop{animation:none;box-shadow:0 0 0 3px var(--glow),0 6px 20px rgba(0,0,0,.35)}}
.t-dark{--bg:#0F1117;--panel:#151821;--raised:#1D2130;--line:#282D3B;--fg:#E4E7EE;--dim:#9AA2B3;--accent:#B79AE8;--accent-fg:#15111C;--accent-soft:rgba(183,154,232,.12);--need:#F2A93B;--ok:#4CC38A;--err:#F2665C;--work:#6EA2FF;--term:#0B0D12}
.t-light{--bg:#E6E9EF;--panel:#F5F6F8;--raised:#FFFFFF;--line:#D3D8E0;--fg:#151922;--dim:#535D6E;--accent:#6237A0;--accent-fg:#FFFFFF;--accent-soft:rgba(98,55,160,.08);--need:#9A5300;--ok:#1B7346;--err:#AE2219;--work:#2758B8;--term:#FCFCFD}
a{color:var(--accent)}a:hover{color:var(--fg)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1280px; height: 800px; display: flex; background: var(--bg); color: var(--fg); font-family: 'Atkinson Hyperlegible Next', 'Helvetica Neue', system-ui, sans-serif; font-size: 13px; line-height: 1.45; overflow: hidden; position: relative">

  <nav aria-label="Projects and terminals" style="flex: 0 0 232px; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line)">
    <div style="display: flex; gap: 8px; align-items: center; height: 44px; padding: 0 14px" aria-hidden="true">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
    </div>
    <div style="padding: 8px 14px 2px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim)">midna</div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <button type="button" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 14px; border: 0; background: {{r.bg}}; text-align: left; cursor: pointer">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}}"></span>
        <span style="flex: 1; font-weight: 500">{{r.name}}</span>
        <span style="color: var(--dim); font-size: 11px; font-family: 'JetBrains Mono', monospace">{{r.agent}}</span>
      </button>
    </sc-for>
  </nav>

  <main style="flex: 1; display: flex; flex-direction: column; min-width: 0">
    <header style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); background: var(--panel)">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-label="Claude"><path d="M8 1.5v13M1.5 8h13M3.4 3.4l9.2 9.2M12.6 3.4l-9.2 9.2"></path></svg>
      <span style="font-weight: 700">api-refactor</span>
      <span style="flex: 1; display: flex; gap: 12px; justify-content: center; color: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 11.5px">
        <span>feat/session-store</span><span><span style="color: var(--ok)">+418</span> <span style="color: var(--err)">−96</span> ×11</span>
      </span>
      <button type="button" aria-label="Split" style="width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--dim)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"></rect><path d="M8 2.5v11"></path></svg></button>
    </header>

    <div style="flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; background: var(--term); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.6">
      <div style="flex: 1; min-height: 0; padding: 14px 18px; overflow: hidden">
        <sc-for list="{{term}}" as="l" hint-placeholder-count="10">
          <div style="color: {{l.c}}; white-space: pre">{{l.t}}</div>
        </sc-for>
      </div>
      <div style="flex: none; padding: 0 18px 10px; color: var(--dim)">
        <div style="border-top: 1px solid var(--line)"></div>
        <div style="padding: 4px 0; color: var(--fg)">❯ <span style="display: inline-block; width: 8px; height: 15px; vertical-align: -2px; background: var(--fg)"></span></div>
        <div style="border-top: 1px solid var(--line)"></div>
        <div style="display: flex; padding-top: 4px; font-size: 11.5px"><span>⏵⏵ accept edits on (shift+tab to cycle)</span><span style="margin-left: auto">Context left until auto-compact: 38%</span></div>
      </div>

      <div style="position: absolute; bottom: 82px; right: 18px; width: 420px; display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 8px">
        <sc-if value="{{justSent}}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{toggle}}" aria-expanded="{{open}}" aria-label="Sent a queued message, 2 left" class="{{glowClass}}" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 10px; border: 1px solid var(--ok); border-radius: 999px; background: var(--raised); color: var(--fg); cursor: pointer">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="var(--ok)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3 3 7-7"></path></svg>
            <b style="color: var(--ok)">Sent</b>
            <span style="color: var(--dim); font-size: 12px">· 2 left, next when Claude is idle</span>
            <span style="color: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 11px">⌘J</span>
          </button>
        </sc-if>
        <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{toggle}}" aria-expanded="{{open}}" aria-label="3 queued messages" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 10px; border: 1px solid var(--accent); border-radius: 999px; background: var(--raised); color: var(--fg); box-shadow: 0 6px 20px rgba(0,0,0,.35); cursor: pointer">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft)"></span>
            <b style="font-variant-numeric: tabular-nums">3 queued</b>
            <span style="color: var(--dim); font-size: 12px">next when Claude is idle</span>
            <span style="color: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 11px">⌘J</span>
          </button>
        </sc-if>
        <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
          <section aria-label="Queued messages" style="width: 100%; display: flex; flex-direction: column; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 48px rgba(0,0,0,.4); overflow: hidden">
            <sc-for list="{{queue}}" as="q" hint-placeholder-count="3">
              <div style="display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; column-gap: 8px; align-items: start; padding: 8px 10px 8px 12px; background: {{q.bg}}">
                <span style="color: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 11.5px; padding-top: 1px">{{q.n}}</span>
                <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <span style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{q.text}}</span>
                  <span style="font-size: 11.5px; color: var(--dim)"><span style="color: var(--accent)">{{q.when}}</span> · {{q.by}}</span>
                </span>
                <button type="button" aria-label="More for message {{q.n}}" style="width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--dim); cursor: pointer">⋯</button>
              </div>
            </sc-for>
            <div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line)">
              <label for="qe-in" style="position: absolute; left: -9999px">Queue a message</label>
              <input id="qe-in" placeholder="Queue another…" style="flex: 1; height: 30px; padding: 0 10px; border: 1px solid var(--accent); border-radius: 7px; background: var(--panel); color: var(--fg); font: inherit">
              <button type="button" style="height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: var(--accent); color: var(--accent-fg); font-weight: 700; cursor: pointer">Queue</button>
            </div>
          </section>
        </sc-if>
      </div>
    </div>

    <footer style="display: flex; align-items: center; gap: 16px; height: 26px; padding: 0 14px; border-top: 1px solid var(--line); background: var(--panel); color: var(--dim); font-size: 11.5px">
      <span><span style="color: var(--work)">●</span> 1 working</span>
      <span style="margin-left: auto">⌥↩ queues instead of sending</span>
    </footer>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"open":{"editor":"boolean","default":false},"justSent":{"editor":"boolean","default":true},"loopGlow":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const D = 'var(--dim)', F = 'var(--fg)', A = 'var(--accent)', W = 'var(--work)';
    const open = this.state.open ?? this.props.open ?? false;
    const glowClass = (this.props.loopGlow ?? true) ? 'q-glow loop' : 'q-glow';
    const term = [
      { t: '> move the session store behind a trait so tests can swap it', c: F },
      { t: '', c: D },
      { t: '⏺ Read(crates/midnad/src/state.rs)', c: A },
      { t: '⏺ Write(crates/midnad/src/store/mod.rs)', c: A },
      { t: '  ⎿ Wrote 212 lines', c: D },
      { t: '⏺ Update(crates/midnad/src/daemon.rs)', c: A },
      { t: '  ⎿ Updated with 34 additions and 51 removals', c: D },
      { t: '⏺ Bash(cargo test -p midnad)', c: A },
      { t: '  ⎿ Running…', c: D },
      { t: '', c: D },
      { t: '✻ Working… (2m 14s · esc to interrupt)', c: W },
    ];
    const sentTerm = [
      ...term.slice(0, 8),
      { t: '  ⎿ test result: ok. 61 passed; 0 failed', c: 'var(--ok)' },
      { t: '', c: D },
      { t: '⏺ The store is behind a trait now; midnad tests pass.', c: F },
      { t: '', c: D },
      { t: '> Now run the full workspace tests and fix anything the trait change broke', c: F },
      { t: '', c: D },
      { t: '✻ Working… (2s · esc to interrupt)', c: W },
    ];
    const all = [
      { n: '1', text: 'Now run the full workspace tests and fix anything the trait change broke', when: 'when idle', by: 'you', bg: 'var(--accent-soft)' },
      { n: '2', text: '/compact', when: 'when idle', by: 'you', bg: 'transparent' },
      { n: '3', text: 'Update docs/DECISIONS.md with what changed and why', when: 'after 5 min idle', by: 'trigger', bg: 'transparent' },
    ];
    const justSent = this.props.justSent ?? true;
    const queue = justSent ? all.slice(1).map((q, i) => ({ ...q, n: String(i + 1), bg: i === 0 ? 'var(--accent-soft)' : 'transparent' })) : all;
    const rows = [
      { name: 'api-refactor', agent: 'claude', dot: 'var(--work)', bg: 'var(--accent-soft)' },
      { name: 'web-ui', agent: 'codex', dot: 'var(--ok)', bg: 'transparent' },
      { name: 'zsh', agent: 'shell', dot: 'var(--dim)', bg: 'transparent' },
      { name: 'cargo watch', agent: 'mon', dot: 'var(--ok)', bg: 'transparent' },
    ];
    return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 't-light' : 't-dark', term: justSent ? sentTerm : term, queue, rows: rows, open, justSent, notSent: !justSent, glowClass, toggle: () => this.setState({ open: !open }) };
  }
}
</script>
</body>
</html>
