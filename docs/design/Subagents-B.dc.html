<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subagents header chip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.t-dark{--bg:#0F1117;--panel:#151821;--raised:#1D2130;--line:#282D3B;--fg:#E4E7EE;--dim:#9AA2B3;--accent:#B79AE8;--accent-fg:#15111C;--accent-soft:rgba(183,154,232,.12);--need:#F2A93B;--ok:#4CC38A;--err:#F2665C;--work:#6EA2FF;--work-soft:rgba(110,162,255,.18);--term:#0B0D12}
.t-light{--bg:#E6E9EF;--panel:#F5F6F8;--raised:#FFFFFF;--line:#D3D8E0;--fg:#151922;--dim:#535D6E;--accent:#6237A0;--accent-fg:#FFFFFF;--accent-soft:rgba(98,55,160,.08);--need:#9A5300;--ok:#1B7346;--err:#AE2219;--work:#2758B8;--work-soft:rgba(39,88,184,.14);--term:#FCFCFD}
a{color:var(--accent)}a:hover{color:var(--fg)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--work-soft)}50%{box-shadow:0 0 0 5px var(--work-soft)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pulse{animation:none;box-shadow:0 0 0 3px var(--work-soft)}}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1280px; height: 800px; display: flex; background: var(--bg); color: var(--fg); font-family: 'Atkinson Hyperlegible Next', 'Helvetica Neue', system-ui, sans-serif; font-size: 13px; line-height: 1.45; overflow: hidden; position: relative">

  <nav aria-label="Projects and terminals" style="flex: 0 0 232px; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line)">
    <div style="display: flex; gap: 8px; align-items: center; height: 44px; padding: 0 14px" aria-hidden="true">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
    </div>
    <div style="padding: 8px 14px 2px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim)">midna</div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <button type="button" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 14px; border: 0; background: {{r.bg}}; text-align: left; cursor: pointer">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}}"></span>
        <span style="flex: 1; font-weight: 500">{{r.name}}</span>
        <span style="color: var(--dim); font-size: 11px; font-family: 'JetBrains Mono', monospace">{{r.agent}}</span>
      </button>
    </sc-for>
  </nav>

  <main style="flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative">
    <header style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); background: var(--panel)">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-label="Claude"><path d="M8 1.5v13M1.5 8h13M3.4 3.4l9.2 9.2M12.6 3.4l-9.2 9.2"></path></svg>
      <span style="font-weight: 700">api-refactor</span>
      <span style="flex: 1; display: flex; gap: 12px; justify-content: center; color: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 11.5px">
        <span>feat/subagents</span><span><span style="color: var(--ok)">+212</span> <span style="color: var(--err)">−18</span> ×6</span>
      </span>
      <sc-if value="{{showChip}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{toggle}}" aria-expanded="{{open}}" aria-label="3 subagents running" style="display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border: 1px solid {{chipBorder}}; border-radius: 7px; background: {{chipBg}}; cursor: pointer">
        <sc-if value="{{iconOrbit}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--work)" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="9" r="4.5"></circle><circle cx="13" cy="3.2" r="1.7" fill="var(--work)" stroke="none"></circle></svg></sc-if>
        <sc-if value="{{iconLayers}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--work)" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="1.5" width="10" height="8" rx="2"></rect><rect x="1.5" y="6.5" width="10" height="8" rx="2" fill="var(--panel)"></rect></svg></sc-if>
        <sc-if value="{{iconSpark}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--work)" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 5v10M1 10h10M2.5 6.5l7 7M9.5 6.5l-7 7"></path><circle cx="13" cy="3" r="1.7" fill="var(--work)" stroke="none"></circle></svg></sc-if>
        <b style="font-variant-numeric: tabular-nums">3</b>
        <span class="pulse" style="width: 6px; height: 6px; border-radius: 50%; background: var(--work)"></span>
      </button>
      </sc-if>
      <button type="button" aria-label="Split" style="width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--dim)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"></rect><path d="M8 2.5v11"></path></svg></button>
    </header>

    <div style="flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; background: var(--term); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.6">
      <div style="flex: 1; min-height: 0; padding: 14px 18px; overflow: hidden">
        <sc-for list="{{term}}" as="l" hint-placeholder-count="10">
          <div style="color: {{l.c}}; white-space: pre">{{l.t}}</div>
        </sc-for>
      </div>
      <div style="flex: none; padding: 0 18px 10px; color: var(--dim)">
        <div style="border-top: 1px solid var(--line)"></div>
        <div style="padding: 4px 0; color: var(--fg)">❯ <span style="display: inline-block; width: 8px; height: 15px; vertical-align: -2px; background: var(--fg)"></span></div>
        <div style="border-top: 1px solid var(--line)"></div>
        <div style="display: flex; padding-top: 4px; font-size: 11.5px"><span>⏵⏵ accept edits on (shift+tab to cycle)</span></div>
      </div>
    </div>

    <sc-if value="{{popover}}" hint-placeholder-val="{{ true }}">
      <section aria-label="Subagents" style="position: absolute; top: 40px; right: 46px; width: 400px; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 48px rgba(0,0,0,.45); overflow: hidden">
        <div style="padding: 10px 14px 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim)">Running</div>
        <sc-for list="{{running}}" as="a" hint-placeholder-count="3">
          <a href="SubagentWindow.dc.html" aria-label="Open {{a.desc}} in a window" style="display: grid; grid-template-columns: minmax(0, 1fr) auto 14px; column-gap: 10px; align-items: start; padding: 7px 14px; color: var(--fg); text-decoration: none; background: {{a.rowBg}}">
            <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 500">{{a.desc}}</span>
              <span style="display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--dim)">
                <span style="font-family: 'JetBrains Mono', monospace">{{a.type}}</span>
                <sc-if value="{{a.bg}}" hint-placeholder-val="{{ false }}">
                  <span>· background, wakes Claude when done</span>
                </sc-if>
              </span>
            </span>
            <span style="color: var(--work); font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-variant-numeric: tabular-nums">{{a.time}}</span>
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="var(--dim)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 3px"><path d="M6 3H3v10h10v-3M9 2h5v5M14 2L7.5 8.5"></path></svg>
          </a>
        </sc-for>
        <div style="margin-top: 4px; padding: 10px 14px 4px; border-top: 1px solid var(--line); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim)">Finished this turn</div>
        <sc-for list="{{finished}}" as="a" hint-placeholder-count="2">
          <a href="SubagentWindow.dc.html" style="display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; padding: 6px 14px; color: var(--dim); text-decoration: none">
            <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="color: var(--ok)">✓</span> {{a.desc}} <span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px">· {{a.type}}</span></span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-variant-numeric: tabular-nums">{{a.time}}</span>
          </a>
        </sc-for>
        <div style="display: flex; justify-content: flex-end; padding: 8px 14px; margin-top: 4px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11.5px">
          <span>Click to open in a window · <span style="font-family: 'JetBrains Mono', monospace">⌥⌘A</span></span>
        </div>
      </section>
    </sc-if>

    <footer style="display: flex; align-items: center; gap: 16px; height: 26px; padding: 0 14px; border-top: 1px solid var(--line); background: var(--panel); color: var(--dim); font-size: 11.5px">
      <span><span style="color: var(--work)">●</span> 1 working</span>
    </footer>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"open":{"editor":"boolean","default":true},"running":{"editor":"boolean","default":true},"icon":{"editor":"enum","options":["orbit","layers","spark"],"default":"orbit"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const D = 'var(--dim)', F = 'var(--fg)', A = 'var(--accent)', W = 'var(--work)';
    const open = this.state.open ?? this.props.open ?? true;
    const term = [
      { t: '> add subagent tracking with descriptions, then review it', c: F },
      { t: '', c: D },
      { t: '⏺ I’ll split this across a few agents.', c: F },
      { t: '', c: D },
      { t: '⏺ Explore(Find where hooks set agent status)', c: A },
      { t: '  ⎿ Done (9 tool uses · 41s)', c: D },
      { t: '⏺ Explore(Map SubagentStart payload fields)', c: A },
      { t: '  ⎿ Running…', c: D },
      { t: '⏺ general-purpose(Draft agent_work tests)', c: A },
      { t: '  ⎿ Running…', c: D },
      { t: '⏺ qa-reviewer(Review daemon changes)', c: A },
      { t: '  ⎿ Backgrounded agent (↓ to manage)', c: D },
      { t: '', c: D },
      { t: '✻ Waiting on 2 agents… (1m 12s · esc to interrupt)', c: W },
    ];
    const running = [
      { desc: 'Map SubagentStart payload fields', type: 'Explore', time: '1m 12s', bg: false, rowBg: 'var(--accent-soft)' },
      { desc: 'Draft agent_work tests', type: 'general-purpose', time: '48s', bg: false, rowBg: 'transparent' },
      { desc: 'Review daemon changes', type: 'qa-reviewer', time: '3m 05s', bg: true, rowBg: 'transparent' },
    ];
    const run = this.props.running ?? true;
    const icon = this.props.icon ?? 'orbit';
    const finished = [
      { desc: 'Find where hooks set agent status', type: 'Explore', time: '41s' },
    ];
    const rows = [
      { name: 'api-refactor', agent: 'claude', dot: 'var(--work)', bg: 'var(--accent-soft)' },
      { name: 'web-ui', agent: 'codex', dot: 'var(--ok)', bg: 'transparent' },
      { name: 'zsh', agent: 'shell', dot: 'var(--dim)', bg: 'transparent' },
      { name: 'cargo watch', agent: 'mon', dot: 'var(--ok)', bg: 'transparent' },
    ];
    return { showChip: run, popover: run && open, iconOrbit: icon === 'orbit', iconLayers: icon === 'layers', iconSpark: icon === 'spark', themeClass: (this.props.theme ?? 'dark') === 'light' ? 't-light' : 't-dark', term, running, finished, rows, open, chipBorder: open ? 'var(--work)' : 'var(--line)', chipBg: open ? 'var(--work-soft)' : 'transparent', toggle: () => this.setState({ open: !open }) };
  }
}
</script>
</body>
</html>
