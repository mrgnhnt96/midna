<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Links popover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.t-dark{--bg:#0F1117;--panel:#151821;--raised:#1D2130;--line:#282D3B;--fg:#E4E7EE;--dim:#9AA2B3;--accent:#B79AE8;--accent-fg:#15111C;--accent-soft:rgba(183,154,232,.12);--need:#F2A93B;--ok:#4CC38A;--err:#F2665C;--work:#6EA2FF;--term:#0B0D12}
.t-light{--bg:#E6E9EF;--panel:#F5F6F8;--raised:#FFFFFF;--line:#D3D8E0;--fg:#151922;--dim:#535D6E;--accent:#6237A0;--accent-fg:#FFFFFF;--accent-soft:rgba(98,55,160,.08);--need:#9A5300;--ok:#1B7346;--err:#AE2219;--work:#2758B8;--term:#FCFCFD}
a{color:var(--accent)}a:hover{color:var(--fg)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1280px; height: 800px; display: flex; background: var(--bg); color: var(--fg); font-family: 'Atkinson Hyperlegible Next', 'Helvetica Neue', system-ui, sans-serif; font-size: 13px; line-height: 1.45; overflow: hidden; position: relative">

  <nav aria-label="Projects and terminals" style="flex: 0 0 232px; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line)">
    <div style="display: flex; gap: 8px; align-items: center; height: 44px; padding: 0 14px" aria-hidden="true">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
    </div>
    <div style="padding: 8px 14px 2px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim)">midna</div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <button type="button" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 14px; border: 0; background: {{r.bg}}; text-align: left; cursor: pointer">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}}"></span>
        <span style="flex: 1; font-weight: 500">{{r.name}}</span>
        <span style="color: var(--dim); font-size: 11px; font-family: 'JetBrains Mono', monospace">{{r.agent}}</span>
      </button>
    </sc-for>
  </nav>

  <main style="flex: 1; display: flex; flex-direction: column; min-width: 0">
    <header style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); background: var(--panel)">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-label="Claude"><path d="M8 1.5v13M1.5 8h13M3.4 3.4l9.2 9.2M12.6 3.4l-9.2 9.2"></path></svg>
      <span style="font-weight: 700">session-links</span>
      <span style="flex: 1; display: flex; gap: 12px; justify-content: center; color: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 11.5px">
        <span>feat/session-links</span><span><span style="color: var(--ok)">+212</span> <span style="color: var(--err)">−31</span> ×6</span>
      </span>
      <button type="button" aria-label="Session links, 9 items, 3 pinned" aria-expanded="true" style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--accent); border-radius: 7px; background: var(--accent-soft); color: var(--accent); cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6.5 9.5l3-3M7 4.5l1.2-1.2a2.8 2.8 0 0 1 4 4L11 8.5M9 11.5l-1.2 1.2a2.8 2.8 0 0 1-4-4L5 7.5"></path></svg>
        <b style="font-variant-numeric: tabular-nums">9</b>
        <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--accent)" title="1 new since you looked"></span>
      </button>
      <button type="button" aria-label="Split" style="width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--dim)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"></rect><path d="M8 2.5v11"></path></svg></button>
    </header>

    <div style="flex: 1; background: var(--term); padding: 14px 18px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.6; overflow: hidden">
      <sc-for list="{{term}}" as="l" hint-placeholder-count="12">
        <div style="color: {{l.c}}; white-space: pre">{{l.t}}</div>
      </sc-for>
    </div>
  </main>

  <section aria-label="Session links" style="position: absolute; top: 50px; right: 52px; width: 440px; display: flex; flex-direction: column; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 48px rgba(0,0,0,.35); overflow: hidden">
    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 14px">
      <label for="lk-q" style="position: absolute; left: -9999px">Filter links</label>
      <input id="lk-q" placeholder="Filter links" style="flex: 1; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--fg); font: inherit">
    </div>
    <div role="tablist" aria-label="Kind" style="display: flex; gap: 4px; padding: 0 12px 8px; border-bottom: 1px solid var(--line)">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{t.sel}}" style="height: 26px; padding: 0 9px; border: 0; border-radius: 6px; background: {{t.bg}}; color: {{t.fg}}; font-size: 12px; cursor: pointer">{{t.label}} <span style="opacity: .7">{{t.n}}</span></button>
      </sc-for>
    </div>
    <div style="padding: 8px 14px 2px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim)">Pinned</div>
    <sc-for list="{{pinned}}" as="it" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding: 7px 10px 7px 14px; {{it.rowStyle}}">
        <span style="display: inline-flex; color: var(--dim)">
          <sc-if value="{{it.isPr}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-label="Pull request"><circle cx="4" cy="3.5" r="1.5"></circle><circle cx="4" cy="12.5" r="1.5"></circle><circle cx="12" cy="12.5" r="1.5"></circle><path d="M4 5v6M12 11V6.5a2 2 0 0 0-2-2H7.5M9 3 7.5 4.5 9 6"></path></svg></sc-if>
          <sc-if value="{{it.isArt}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-label="Artifact"><rect x="2" y="2" width="12" height="12" rx="2"></rect><path d="M5 10.5 7 8l1.5 1.5L11 6"></path></svg></sc-if>
          <sc-if value="{{it.isWeb}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-label="Web page"><circle cx="8" cy="8" r="6.5"></circle><path d="M1.5 8h13M8 1.5c2 2 2.8 4.2 2.8 6.5S10 12.5 8 14.5C6 12.5 5.2 10.3 5.2 8S6 3.5 8 1.5"></path></svg></sc-if>
          <sc-if value="{{it.isFile}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-label="File"><path d="M4 1.5h5l3 3v10H4z"></path><path d="M6 8.5h4M6 11h4"></path></svg></sc-if>
        </span>
        <a href="#" style="min-width: 0; display: flex; flex-direction: column; color: var(--fg); text-decoration: none">
          <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</span>
          <span style="font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.sub}}</span>
        </a>
        <button type="button" aria-label="Unpin {{it.title}}" style="width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; color: var(--accent); cursor: pointer"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M10.5 1.5 14.5 5.5 12 6.5 9.5 9l.5 3.5-1 1L6 10.5 2.5 14l-.5-.5L5.5 10 2.5 7l1-1L7 6.5 9.5 4z"></path></svg></button>
      </div>
    </sc-for>
    <div style="padding: 10px 14px 2px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim)">This session</div>
    <sc-for list="{{rest}}" as="it" hint-placeholder-count="5">
      <div style="display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding: 7px 10px 7px 14px; {{it.rowStyle}}">
        <span style="display: inline-flex; color: var(--dim)">
          <sc-if value="{{it.isPr}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-label="Pull request"><circle cx="4" cy="3.5" r="1.5"></circle><circle cx="4" cy="12.5" r="1.5"></circle><circle cx="12" cy="12.5" r="1.5"></circle><path d="M4 5v6M12 11V6.5a2 2 0 0 0-2-2H7.5M9 3 7.5 4.5 9 6"></path></svg></sc-if>
          <sc-if value="{{it.isArt}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-label="Artifact"><rect x="2" y="2" width="12" height="12" rx="2"></rect><path d="M5 10.5 7 8l1.5 1.5L11 6"></path></svg></sc-if>
          <sc-if value="{{it.isWeb}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-label="Web page"><circle cx="8" cy="8" r="6.5"></circle><path d="M1.5 8h13M8 1.5c2 2 2.8 4.2 2.8 6.5S10 12.5 8 14.5C6 12.5 5.2 10.3 5.2 8S6 3.5 8 1.5"></path></svg></sc-if>
          <sc-if value="{{it.isFile}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-label="File"><path d="M4 1.5h5l3 3v10H4z"></path><path d="M6 8.5h4M6 11h4"></path></svg></sc-if>
        </span>
        <a href="#" style="min-width: 0; display: flex; flex-direction: column; color: var(--fg); text-decoration: none">
          <span style="display: flex; gap: 6px; align-items: center; min-width: 0"><span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</span><sc-if value="{{it.isNew}}" hint-placeholder-val="{{ false }}"><span style="flex: none; padding: 0 5px; border-radius: 4px; background: var(--accent); color: var(--accent-fg); font-size: 10px; font-weight: 700">NEW</span></sc-if></span>
          <span style="font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.sub}}</span>
        </a>
        <button type="button" aria-label="Pin {{it.title}}" style="width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; color: var(--dim); cursor: pointer"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 1.5 14.5 5.5 12 6.5 9.5 9l.5 3.5-1 1L6 10.5 2.5 14l-.5-.5L5.5 10 2.5 7l1-1L7 6.5 9.5 4z"></path></svg></button>
      </div>
    </sc-for>
    <div style="display: flex; gap: 14px; padding: 9px 14px; margin-top: 6px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11.5px">
      <span><kbd style="font-family: 'JetBrains Mono', monospace">↵</kbd> open</span>
      <span><kbd style="font-family: 'JetBrains Mono', monospace">⌥↵</kbd> jump to where it came up</span>
      <span><kbd style="font-family: 'JetBrains Mono', monospace">P</kbd> pin</span>
      <span style="margin-left: auto"><kbd style="font-family: 'JetBrains Mono', monospace">⌘L</kbd></span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const kinds = (it) => ({ ...it, isPr: it.k === 'pr', isArt: it.k === 'art', isWeb: it.k === 'web', isFile: it.k === 'file', rowStyle: it.hl ? 'background: var(--accent-soft)' : '' });
    const pinned = [
      { k: 'pr', title: 'PR #12 · feat: session links', sub: 'github.com/mrgnhnt96/midna · checks passing · Claude ran gh pr create' },
      { k: 'art', title: 'Midna Session Links (design canvas)', sub: 'claude.ai/artifact/… · Claude published' },
      { k: 'web', title: 'Hooks reference', sub: 'docs.claude.com/…/hooks · you pasted' },
    ].map(kinds);
    const rest = [
      { k: 'pr', title: 'PR #12 review comment from a reviewer', sub: 'github.com/…/pull/12#discussion · 1 min ago', isNew: true, hl: true },
      { k: 'web', title: 'serde_json streaming deserializer', sub: 'docs.rs/serde_json · Claude fetched' },
      { k: 'file', title: 'crates/midnad/src/links.rs', sub: 'created · 3 edits' },
      { k: 'file', title: 'crates/midna-proto/src/types.rs', sub: 'edited · 2 edits' },
      { k: 'web', title: 'localhost:7411/debug', sub: 'Claude said · 2× mentioned' },
      { k: 'file', title: 'docs/DECISIONS.md', sub: 'edited · 1 edit' },
    ].map(kinds);
    const D = 'var(--dim)', F = 'var(--fg)', A = 'var(--accent)', O = 'var(--ok)';
    const term = [
      { t: '> add a links store to the daemon, keyed by session', c: F },
      { t: '', c: D },
      { t: '⏺ Read(crates/midnad/src/agent_work.rs)', c: A },
      { t: '⏺ Write(crates/midnad/src/links.rs)', c: A },
      { t: '  ⎿ Wrote 148 lines', c: D },
      { t: '⏺ Bash(cargo test -p midnad links)', c: A },
      { t: '  ⎿ test result: ok. 9 passed; 0 failed', c: O },
      { t: '⏺ Bash(gh pr create --fill)', c: A },
      { t: '  ⎿ https://github.com/mrgnhnt96/midna/pull/12', c: D },
      { t: '', c: D },
      { t: '⏺ Opened PR #12. The daemon now tails the transcript and', c: F },
      { t: '  records every URL, PR and file it sees, with where it came up.', c: F },
      { t: '', c: D },
      { t: '> a reviewer left a comment, can you take a look', c: F },
      { t: '', c: D },
      { t: '⏺ Bash(gh pr view 12 --comments)', c: A },
      { t: '  ⎿ …', c: D },
    ];
    const rows = [
      { name: 'session-links', agent: 'claude', dot: 'var(--work)', bg: 'var(--accent-soft)' },
      { name: 'term-edit', agent: 'codex', dot: 'var(--ok)', bg: 'transparent' },
      { name: 'zsh', agent: 'shell', dot: 'var(--dim)', bg: 'transparent' },
      { name: 'cargo watch', agent: 'mon', dot: 'var(--ok)', bg: 'transparent' },
    ];
    const tabs = [['All', 9, true], ['PRs', 2], ['Artifacts', 1], ['Web', 3], ['Files', 3]].map(([label, n, sel]) => ({ label, n, sel: !!sel, bg: sel ? 'var(--accent-soft)' : 'transparent', fg: sel ? 'var(--accent)' : 'var(--dim)' }));
    return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 't-light' : 't-dark', pinned, rest, term, rows, tabs };
  }
}
</script>
</body>
</html>
