<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Schedule trigger editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.t-dark{--bg:#0F1117;--panel:#151821;--raised:#1D2130;--line:#282D3B;--fg:#E4E7EE;--dim:#9AA2B3;--accent:#B79AE8;--accent-fg:#15111C;--accent-soft:rgba(183,154,232,.12);--need:#F2A93B;--ok:#4CC38A;--err:#F2665C;--work:#6EA2FF;--work-soft:rgba(110,162,255,.18);--term:#0B0D12}
.t-light{--bg:#E6E9EF;--panel:#F5F6F8;--raised:#FFFFFF;--line:#D3D8E0;--fg:#151922;--dim:#535D6E;--accent:#6237A0;--accent-fg:#FFFFFF;--accent-soft:rgba(98,55,160,.08);--need:#9A5300;--ok:#1B7346;--err:#AE2219;--work:#2758B8;--work-soft:rgba(39,88,184,.14);--term:#FCFCFD}
a{color:var(--accent)}a:hover{color:var(--fg)}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.mono{font-family:'JetBrains Mono',monospace}
.btn{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:var(--raised);cursor:pointer}
.fld{height:30px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:var(--raised)}
.sw{width:30px;height:18px;border-radius:9px;border:0;background:var(--accent);position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:12px;height:12px;border-radius:50%;background:var(--accent-fg)}
.sw.off{background:var(--line)}.sw.off::after{right:auto;left:3px;background:var(--dim)}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1280px; height: 800px; display: flex; background: var(--bg); color: var(--fg); font-family: 'Atkinson Hyperlegible Next', 'Helvetica Neue', system-ui, sans-serif; font-size: 13px; line-height: 1.45; overflow: hidden">

  <nav aria-label="Projects and terminals" style="flex: 0 0 232px; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line)">
    <div style="display: flex; gap: 8px; align-items: center; height: 44px; padding: 0 14px" aria-hidden="true">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
    </div>
    <div class="cap" style="padding: 8px 14px 2px">midna</div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <button type="button" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 14px; border: 0; background: transparent; text-align: left; cursor: pointer">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}}"></span>
        <span style="flex: 1; font-weight: 500">{{r.name}}</span>
        <span class="mono" style="color: var(--dim); font-size: 11px">{{r.agent}}</span>
      </button>
    </sc-for>
    <div style="flex: 1"></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 10px">
      <button type="button" style="height: 30px; border: 0; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-weight: 700">Triggers</button>
      <button type="button" style="height: 30px; border: 0; border-radius: 7px; background: transparent; color: var(--dim)">Rules</button>
      <button type="button" style="height: 30px; border: 0; border-radius: 7px; background: transparent; color: var(--dim)">Settings</button>
    </div>
  </nav>

  <main style="flex: 1; display: flex; flex-direction: column; min-width: 0">
    <header style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--panel)">
      <span style="font-weight: 700">Triggers</span>
    </header>

    <div style="flex: 1; min-height: 0; display: flex">
      <div style="flex: 0 0 380px; display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0">
        <div role="tablist" aria-label="Lists" style="flex: none; display: flex; gap: 18px; padding: 0 16px; border-bottom: 1px solid var(--line)">
          <button type="button" role="tab" aria-selected="true" style="height: 40px; padding: 0 2px; border: 0; border-bottom: 2px solid var(--accent); background: transparent; font-weight: 700">Triggers <span style="margin-left: 4px; padding: 1px 6px; border-radius: 8px; background: var(--line); color: var(--dim); font-size: 11px">13</span></button>
          <a href="Crons-D.dc.html" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; height: 40px; padding: 0 2px; border-bottom: 2px solid transparent; color: var(--dim); font-weight: 700; text-decoration: none">Crons <span style="margin-left: 4px; padding: 1px 6px; border-radius: 8px; background: var(--line); color: var(--dim); font-size: 11px">8</span></a>
        </div>
        <div style="flex: 1; min-height: 0; overflow: auto; padding: 4px 0 10px">
          <sc-for list="{{triggers}}" as="t" hint-placeholder-count="10">
            <div style="display: flex; align-items: center; gap: 10px; padding: 7px 16px; background: {{t.bg}}">
              <button type="button" class="{{t.swClass}}" role="switch" aria-checked="{{t.on}}" aria-label="{{t.name}}"></button>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                <span style="font-weight: 500">{{t.name}}</span>
                <span style="color: var(--dim); font-size: 11.5px">{{t.sub}}</span>
              </span>
            </div>
          </sc-for>
        </div>
      </div>

      <section aria-label="Edit schedule" style="flex: 1; min-width: 0; overflow: auto; padding: 18px 24px 24px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span class="cap">Schedule trigger</span>
          <span style="color: var(--dim)">copied from cron in <span class="mono">api-refactor</span></span>
        </div>
        <input aria-label="Name" value="Poll the deploy" style="display: block; width: 100%; box-sizing: border-box; margin-top: 8px; padding: 2px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; font-size: 19px; font-weight: 700">

        <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr); row-gap: 14px; column-gap: 12px; align-items: center; margin-top: 18px">
          <span class="cap">Runs</span>
          <div role="group" aria-label="Runs" style="display: inline-flex; width: max-content; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px">
            <button type="button" onClick="{{setOnce}}" aria-pressed="{{once}}" style="height: 26px; padding: 0 12px; border: 0; border-radius: 6px; background: {{onceBg}}; color: {{onceFg}}; cursor: pointer">Once</button>
            <button type="button" onClick="{{setRepeat}}" aria-pressed="{{repeat}}" style="height: 26px; padding: 0 12px; border: 0; border-radius: 6px; background: {{repBg}}; color: {{repFg}}; cursor: pointer">↻ Repeats</button>
          </div>

          <sc-if value="{{once}}" hint-placeholder-val="{{ false }}">
            <span class="cap">At</span>
            <span style="display: flex; gap: 8px"><input class="fld" aria-label="Date" value="Mon, Oct 6" style="width: 120px"><input class="fld" aria-label="Time" value="2:30 PM" style="width: 90px"></span>
          </sc-if>

          <sc-if value="{{repeat}}" hint-placeholder-val="{{ true }}">
            <span class="cap">Every</span>
            <span style="display: flex; gap: 8px; align-items: center">
              <input class="fld" aria-label="Interval" value="5" style="width: 48px; text-align: right">
              <select class="fld" aria-label="Unit"><option>minutes</option><option>hours</option><option>days</option></select>
            </span>

            <span class="cap">Between</span>
            <span style="display: flex; gap: 10px; align-items: center">
              <button type="button" class="{{winClass}}" role="switch" aria-checked="{{win}}" aria-label="Only between set hours" onClick="{{toggleWin}}"></button>
              <sc-if value="{{win}}" hint-placeholder-val="{{ true }}">
                <input class="fld" aria-label="From" value="1:00 PM" style="width: 86px"><span style="color: var(--dim)">and</span><input class="fld" aria-label="Until" value="5:00 PM" style="width: 86px">
              </sc-if>
              <sc-if value="{{noWin}}" hint-placeholder-val="{{ false }}"><span style="color: var(--dim)">Any time of day</span></sc-if>
            </span>

            <span class="cap">On</span>
            <span style="display: flex; gap: 4px">
              <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
                <button type="button" onClick="{{d.toggle}}" aria-pressed="{{d.on}}" aria-label="{{d.full}}" style="width: 30px; height: 30px; border: 1px solid {{d.border}}; border-radius: 7px; background: {{d.bg}}; color: {{d.fg}}; font-weight: 700; cursor: pointer">{{d.l}}</button>
              </sc-for>
            </span>

            <span class="cap">Starts</span>
            <span style="display: flex; gap: 8px; align-items: center"><select class="fld" aria-label="Starts"><option>Now</option><option>On a date…</option></select></span>

            <span class="cap">Ends</span>
            <span style="display: flex; gap: 8px; align-items: center">
              <select class="fld" aria-label="Ends"><option>On a date</option><option>Never</option><option>After a number of runs</option></select>
              <input class="fld" aria-label="End date" value="Fri, Oct 10" style="width: 110px">
            </span>
          </sc-if>

          <span class="cap">Then</span>
          <span style="display: flex; gap: 8px; align-items: center"><span>Send to</span><select class="fld" aria-label="Terminal"><option>api-refactor</option><option>docs-site</option></select></span>
        </div>
        <textarea aria-label="Prompt" style="display: block; width: 100%; box-sizing: border-box; height: 58px; margin-top: 10px; margin-left: 108px; max-width: calc(100% - 108px); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); resize: none">Poll the deploy and tell me when it is live</textarea>

        <div style="margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel)">
          <div style="font-weight: 700">{{summary}}</div>
          <div style="margin-top: 4px; color: var(--dim)">Next: <span class="mono">{{nextRuns}}</span></div>
          <div class="mono" style="margin-top: 4px; color: var(--dim); font-size: 11.5px">{{cron}}</div>
        </div>

        <div style="display: flex; gap: 8px; margin-top: 16px">
          <button type="button" class="btn" style="background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700">Save trigger</button>
          <a href="Crons-D.dc.html" class="btn" style="display: inline-flex; align-items: center; color: var(--fg); text-decoration: none">Cancel</a>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const once = this.state.once ?? false;
    const win = this.state.win ?? true;
    const on = this.state.days ?? [true, true, true, true, true, false, false];
    const L = ['M', 'T', 'W', 'T', 'F', 'S', 'S'], F = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const days = L.map((l, i) => ({ l, full: F[i], on: on[i], bg: on[i] ? 'var(--accent-soft)' : 'transparent', fg: on[i] ? 'var(--accent)' : 'var(--dim)', border: on[i] ? 'var(--accent)' : 'var(--line)', toggle: () => { const d = on.slice(); d[i] = !d[i]; this.setState({ days: d }); } }));
    const weekdays = on.slice(0, 5).every(Boolean) && !on[5] && !on[6];
    const every = on.every(Boolean);
    const dayWords = every ? 'every day' : weekdays ? 'weekdays' : F.filter((_, i) => on[i]).map((f) => f.slice(0, 3)).join(', ') || 'no days';
    const dow = every ? '*' : weekdays ? '1-5' : on.map((v, i) => v ? (i + 1) % 7 : null).filter((v) => v !== null).join(',') || '-';
    const summary = once ? 'Once, Mon Oct 6 at 2:30 PM' : 'Every 5 min' + (win ? ', 1–5 PM' : '') + ', ' + dayWords + ' · until Fri Oct 10';
    const cron = once ? 'cron 30 14 6 10 *' : 'cron */5 ' + (win ? '13-16' : '*') + ' * * ' + dow + (win ? '' : '') + ' · ends 2026-10-10';
    const triggers = [
      ['PR review requested', 'GitHub webhook · start Claude in api', true], ['CI failed on main', 'GitHub webhook · start Claude in api', true],
      ['Poll the deploy', 'Every 5 min, 1–5 PM, weekdays · send to api-refactor', true, true],
      ['Issue labeled bug', 'GitHub webhook · attention', true], ['Release published', 'GitHub webhook · run command', false],
      ['Push to main', 'GitHub webhook · set status', true], ['Morning standup notes', 'Weekdays 9:00 AM · start Claude', true],
      ['Weekly dependency check', 'Mon 8:00 AM · start Claude', true], ['Nightly flaky-test sweep', 'Daily 2:00 AM · start Claude', false],
      ['Agent idle 20 min', 'Idle · attention', true], ['Claude finished in api', 'Hook Stop · send to session', true],
      ['Approval waiting 5 min', 'Event · attention', true], ['Codex error', 'Event · set status', true],
    ].map(([name, sub, on, sel]) => ({ name, sub, on, swClass: on ? 'sw' : 'sw off', bg: sel ? 'var(--accent-soft)' : 'transparent' }));
    return {
      themeClass: (this.props.theme ?? 'dark') === 'light' ? 't-light' : 't-dark',
      once, repeat: !once, win, noWin: !win, winClass: win ? 'sw' : 'sw off', days, summary, cron, triggers,
      nextRuns: once ? 'Mon 2:30 PM' : (win ? '1:50 PM, 1:55 PM, 2:00 PM' : '1:50 PM, 1:55 PM, 2:00 PM'),
      onceBg: once ? 'var(--raised)' : 'transparent', onceFg: once ? 'var(--fg)' : 'var(--dim)',
      repBg: once ? 'transparent' : 'var(--raised)', repFg: once ? 'var(--dim)' : 'var(--fg)',
      setOnce: () => this.setState({ once: true }), setRepeat: () => this.setState({ once: false }),
      toggleWin: () => this.setState({ win: !win }),
      rows: [
        { name: 'api-refactor', agent: 'claude', dot: 'var(--work)' }, { name: 'docs-site', agent: 'claude', dot: 'var(--ok)' },
        { name: 'infra', agent: 'claude', dot: 'var(--ok)' }, { name: 'db-migrate', agent: 'claude', dot: 'var(--ok)' },
      ],
    };
  }
}
</script>
</body>
</html>
