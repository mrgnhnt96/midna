[workspace]
resolver = "3"
members = ["crates/midna-proto", "crates/midnad", "crates/midna-cli", "crates/midna-app"]

[workspace.package]
version = "0.1.0-beta.15"
edition = "2024"
license = "MIT"

[workspace.dependencies]
midna-proto = { path = "crates/midna-proto" }
midnad = { path = "crates/midnad" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
libc = "0.2"
libghostty-vt = "0.2.2"
schemars = "1.2"

[profile.dev.package."*"]
opt-level = 2
