<!doctype html>
<!--
  The background of the DMG window, in points. The design is 660 × 400; it's
  drawn 420 tall so a Mac whose title bar is shorter than macOS 26's shows
  more background rather than a white strip. scripts/render-dmg-background.sh
  renders it to background.tiff.

  Finder draws the two icons on top, centred where scripts/dmg-settings.py
  puts them: Midna at (180, 170) and Applications at (480, 170). The moon
  phases arc from one to the other, waxing toward Applications, and the glow
  sits behind Applications, so moving an icon means moving these too.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midna DMG background</title>
<style>
  @font-face {
    font-family: "Inter Variable";
    font-weight: 100 900;
    src: url("../../../site/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
  }
  html, body { margin: 0; width: 660px; height: 420px; overflow: hidden; background: #0f1117; }
  .layer { position: absolute; left: 0; top: 0; }
  /* A soft glow behind Applications: where the moon ends up full. */
  .glow {
    position: absolute; left: 416px; top: 106px; width: 128px; height: 128px;
    border-radius: 40px; background: rgba(183, 154, 232, 0.28); filter: blur(22px);
  }
  /* Finder always draws icon names black over a background image, even in
     dark mode, so each name gets a light tag where Finder writes it
     (measured on macOS 26: centred under the icon, about y 243 to 264). */
  .tag { position: absolute; top: 242px; height: 22px; border-radius: 11px; background: #e4e7ee; }
  .tag.app { left: 148px; width: 64px; }
  .tag.applications { left: 431px; width: 98px; }
  .hint {
    position: absolute; left: 0; right: 0; top: 330px; text-align: center;
    font-family: "Inter Variable", sans-serif; font-size: 18px; font-weight: 600; color: #e4e7ee;
  }
</style>
</head>
<body>
<svg class="layer" width="660" height="400" viewBox="0 0 660 400">
  <!-- The path the moon takes, Midna to Applications. -->
  <path d="M 180 96 Q 330 -10 480 96" fill="none" stroke="#383e50" stroke-width="1.5" stroke-dasharray="3 6"/>
  <g fill="#E4E7EE">
    <circle cx="60" cy="40" r="1.3" opacity="0.3"/>
    <circle cx="600" cy="300" r="1.4" opacity="0.25"/>
    <circle cx="40" cy="330" r="1.2" opacity="0.2"/>
    <circle cx="620" cy="60" r="1.5" opacity="0.3"/>
    <circle cx="330" cy="290" r="1.1" opacity="0.2"/>
  </g>
  <!-- Phases: crescent, wider crescent, half, gibbous, full. -->
  <mask id="p1"><rect width="660" height="400" fill="white"/><circle cx="245" cy="53" r="9" fill="black"/></mask>
  <circle cx="241" cy="56" r="9" fill="#B79AE8" mask="url(#p1)"/>
  <mask id="p2"><rect width="660" height="400" fill="white"/><circle cx="293" cy="40" r="10" fill="black"/></mask>
  <circle cx="286" cy="42" r="10" fill="#B79AE8" mask="url(#p2)"/>
  <path d="M 330 26 A 11 11 0 0 1 330 48 Z" fill="#B79AE8"/>
  <circle cx="330" cy="37" r="11" fill="none" stroke="#B79AE8" stroke-opacity="0.35"/>
  <mask id="p4"><rect width="660" height="400" fill="white"/><circle cx="357" cy="40" r="11" fill="black"/></mask>
  <circle cx="374" cy="42" r="10" fill="#B79AE8" mask="url(#p4)"/>
  <circle cx="419" cy="56" r="10" fill="#B79AE8"/>
  <circle cx="419" cy="56" r="20" fill="#B79AE8" fill-opacity="0.12"/>
</svg>
<div class="glow"></div>
<div class="tag app"></div>
<div class="tag applications"></div>
<div class="hint">Drag Midna into Applications</div>
</body>
</html>
