[package]
name = "midnad"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "midnad"
path = "src/main.rs"

[dependencies]
midna-proto.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
