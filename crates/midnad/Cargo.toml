[package]
name = "midnad"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "midnad"
path = "src/main.rs"

[dependencies]
midna-proto.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
toml_edit = "0.25"
libc.workspace = true
libghostty-vt.workspace = true
tiny_http = "0.12"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
snow = { version = "0.10", default-features = false, features = ["std", "use-chacha20poly1305", "use-curve25519", "use-sha2", "use-getrandom"] }
security-framework = "3"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
