[package]
name = "midna-install-spike"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "midna"
path = "src/bin/midna.rs"

[[bin]]
name = "midnad"
path = "src/bin/midnad.rs"

[[bin]]
name = "spike-sign"
path = "src/bin/spike-sign.rs"

[dependencies]
libc = "0.2"
cargo-packager-updater = "0.2.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-service-management = "0.3"
minisign = "0.7"
base64 = "0.22"
semver = "1"
url = "2"
