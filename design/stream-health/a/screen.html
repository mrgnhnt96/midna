<template id="uh-screen">
<style>
:host { color-scheme: light dark; }
[data-screen] {
  /* Midna Twilight (dark) / Midna Daylight (light), from midna-proto themes.rs */
  --bg: light-dark(#E6E9EF, #0F1117);
  --panel: light-dark(#F5F6F8, #151821);
  --raised: light-dark(#FFFFFF, #1D2130);
  --line: light-dark(#D3D8E0, #282D3B);
  --fg: light-dark(#151922, #E4E7EE);
  --dim: light-dark(#535D6E, #9AA2B3);
  --accent: light-dark(#6237A0, #B79AE8);
  --accent-fg: light-dark(#FFFFFF, #15111C);
  --need: light-dark(#9A5300, #F2A93B);
  --need-text: light-dark(#7A4100, #F2A93B);
  --ok: light-dark(#1B7346, #4CC38A);
  --err: light-dark(#AE2219, #F2665C);
  --work: light-dark(#2758B8, #6EA2FF);
  --term: light-dark(#FCFCFD, #0B0D12);
  --note: light-dark(#FFF6D6, #2A2614);
  --note-line: light-dark(#B08A1E, #8A7430);
  height: 100%;
  overflow: hidden;
  font: 400 0.8125rem/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  color: var(--fg);
  background: var(--bg);
}
button { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0; cursor: pointer; text-align: start; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { flex: none; display: block; }
[hidden] { display: none !important; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

/* ── Window ── */
.app { position: relative; height: 100%; display: grid; grid-template-columns: 248px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
@container screen (width < 900px) { .app { grid-template-columns: 228px minmax(0, 1fr); } }
.sb { grid-row: 1; display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-right: 1px solid var(--line); }
/* the titlebar strip (AppKit draws the traffic lights in the frame above) */
.tl { height: 8px; flex: none; }
.needpill { margin: 0 10px 10px; min-height: 34px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1.5px solid var(--need); border-radius: 8px; background: color-mix(in srgb, var(--need) 10%, transparent); color: var(--need-text); font-weight: 700; }
.needpill:hover { background: color-mix(in srgb, var(--need) 16%, transparent); }
.needpill kbd { margin-left: auto; font: 600 0.6875rem ui-monospace, monospace; }
.needpill i { width: 7px; height: 7px; border-radius: 50%; background: var(--need); }
.needpill .roll { display: inline-block; }
.needpill.bump .roll { animation: bump 420ms cubic-bezier(.34,1.56,.64,1); }
@keyframes bump { from { transform: translateY(70%); opacity: 0; } }
.needpill.none { border-color: var(--line); background: none; color: var(--dim); font-weight: 600; }
.needpill.none i { display: none; }
.list { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }
.hd { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 14px; margin-top: 6px; }
.gcap { flex: 1; min-width: 0; font-size: 0.6875rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--need); color: light-dark(#fff, #15111C); font-size: 0.6875rem; font-weight: 700; display: grid; place-items: center; }
.ib { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; color: var(--dim); }
.ib:hover { background: var(--raised); color: var(--fg); }
.row { position: relative; display: grid; grid-template-columns: 14px minmax(0, 1fr) 18px; column-gap: 8px; align-items: center; width: 100%; min-height: 32px; padding: 5px 12px 5px 14px; font-weight: 600; }
.row:hover { background: color-mix(in srgb, var(--raised) 55%, transparent); }
.row.on { background: var(--raised); }
.row.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.row:focus-visible { outline-offset: -2px; border-radius: 0; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .ag { color: var(--dim); }
.row .sub { grid-column: 2 / 4; font-weight: 500; font-size: 0.75rem; overflow-wrap: anywhere; }
.dot { width: 9px; height: 9px; border-radius: 50%; justify-self: center; flex: none; }
.dot.work { background: var(--work); }
.dot.need { background: var(--need); box-shadow: 0 0 0 3px color-mix(in srgb, var(--need) 25%, transparent); }
.dot.ok { background: var(--ok); } .dot.idle { border: 1.5px solid var(--dim); }
.dot.err { background: var(--err); }
/* restarting: a blue ring that turns while it waits for the next try */
.dot.rst { border: 2px solid var(--work); border-right-color: transparent; }
@media (prefers-reduced-motion: no-preference) { .dot.rst { animation: spin 1.2s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
.sub.need { color: var(--need-text); } .sub.dim { color: var(--dim); } .sub.err { color: var(--err); } .sub.work { color: var(--work); } .sub.ok { color: var(--ok); }

/* ── STREAMS group: pinned above the footer, outside the list's scroll (like Background) ── */
.sgrp { flex: none; display: flex; flex-direction: column; border-top: 1px solid var(--line); padding-bottom: 6px; background: color-mix(in srgb, var(--panel) 40%, var(--bg)); }
.ghd { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; width: 100%; min-height: 32px; padding: 6px 14px 4px 12px; color: var(--dim); }
.ghd:hover, .ghd[aria-expanded="true"]:hover { color: var(--fg); }
.ghd:hover .gcap, .ghd:hover .gsum { color: var(--fg); }
.ghd .chev { transition: transform 180ms cubic-bezier(.2,.8,.2,1); }
.ghd[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.ghd .gcap { flex: 0 1 auto; }
.ghd .gsum { margin-left: auto; font-size: 0.75rem; color: var(--dim); white-space: nowrap; }
.ghd .gd { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.ghd .gd.err { background: var(--err); } .ghd .gd.need { background: var(--need); }
.ghd:focus-visible { outline-offset: -2px; border-radius: 0; }
.srows { display: flex; flex-direction: column; max-height: min(220px, 30cqh); overflow-y: auto; }
.srow .nm.quiet { color: var(--dim); font-weight: 500; }
.srow .ag { color: var(--dim); }
@media (prefers-reduced-motion: no-preference) {
  .srow.in { animation: rowOut 260ms cubic-bezier(.2,.8,.2,1) both; }
  .srows.unfold > .srow { animation: rowOut 200ms cubic-bezier(.2,.8,.2,1) both; }
  .srow.leave { animation: rowIn 240ms ease-in both; }
}
@keyframes rowOut { from { opacity: 0; max-height: 0; padding-block: 0; } to { max-height: 60px; opacity: 1; } }
@keyframes rowIn { from { max-height: 60px; } to { opacity: 0; max-height: 0; padding-block: 0; } }

/* ── Footer ── */
.foot { flex: none; border-top: 1px solid var(--line); padding: 10px; display: grid; gap: 8px; }
.today { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.today .th { display: flex; flex-wrap: wrap; align-items: center; }
.today .th .gcap { flex: 1; }
.today .th button { min-height: 24px; padding: 0 4px; border-radius: 6px; color: var(--dim); font-size: 0.75rem; }
.today .th button:hover { color: var(--fg); background: var(--raised); }
.today .stats { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 8px; }
.today .stats b { display: block; font: 700 0.875rem ui-monospace, "SF Mono", Menlo, monospace; }
.today .stats span { color: var(--dim); font-size: 0.6875rem; white-space: nowrap; }
.fbtns { display: flex; justify-content: space-around; }
.fbtns button { display: grid; justify-items: center; gap: 2px; min-width: 56px; padding: 4px; border-radius: 6px; font-size: 0.6875rem; color: var(--dim); }
.fbtns button:hover { background: var(--raised); color: var(--fg); }

/* ── Main pane ── */
.pane { grid-row: 1; position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--term); }
.ph { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--line); background: var(--bg); min-width: 0; }
.ph .t { font-weight: 700; font-size: 0.9375rem; white-space: nowrap; }
.ph .ag { color: var(--dim); }
.ph .mid { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; padding-left: 10px; margin-left: 2px; border-left: 1px solid var(--line); color: var(--dim); font-size: 0.75rem; white-space: nowrap; }
.ph .mid .sw { font-weight: 700; }
.ph .mid .sep { color: var(--dim); }
.sw.ok { color: var(--ok); } .sw.err { color: var(--err); } .sw.work { color: var(--work); } .sw.need { color: var(--need-text); } .sw.dim { color: var(--dim); }
.ph .tools { margin-left: auto; display: flex; gap: 2px; flex: none; }
.ph .tools .ib { width: 30px; height: 30px; }
@container screen (width < 1180px) { .ph .mid .m3 { display: none; } }
@container screen (width < 1000px) { .ph .mid .m2 { display: none; } }
@container screen (width < 820px) { .ph .mid { display: none; } }
.body { position: relative; flex: 1; min-height: 0; overflow: hidden; padding: 14px 18px; font: 0.78rem/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: var(--fg); }
.body p { margin: 0; white-space: pre; }
.body .b { color: var(--accent); } .body .g { color: var(--ok); } .body .d { color: var(--dim); }
.body .lnk { text-decoration: underline; color: var(--work); }
.prompt { margin-top: 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 0; }

/* The stream view: not a terminal, so no prompt; command + secrets, then one timeline */
.facts { flex: none; display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 0.75rem; }
.facts .fk { color: var(--dim); margin-right: 6px; }
.facts code { font: 0.75rem ui-monospace, "SF Mono", Menlo, monospace; }
.facts .fi { display: flex; align-items: center; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; margin-right: 4px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); font: 600 0.6875rem ui-monospace, "SF Mono", Menlo, monospace; color: var(--fg); }
.chip svg { color: var(--dim); }
.seg { margin-left: auto; display: flex; gap: 2px; padding: 2px; border-radius: 8px; border: 1px solid var(--dim); background: var(--bg); }
.seg button { min-height: 24px; padding: 0 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; color: var(--dim); }
.seg button:hover { color: var(--fg); }
.seg button[aria-checked="true"] { background: var(--raised); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.lg { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 0 14px; font: 0.75rem/1.75 ui-monospace, "SF Mono", Menlo, monospace; }
.ll { display: grid; grid-template-columns: 5.2rem 3.9rem minmax(0, 1fr) auto; column-gap: 10px; padding: 0 18px; }
.ll:hover { background: color-mix(in srgb, var(--raised) 60%, transparent); }
.ll .tm { color: var(--dim); }
.ll .src { color: var(--dim); }
.ll .src.midna { color: var(--accent); } .ll .src.event { color: var(--work); }
.ll .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ll .tx.dim { color: var(--dim); }
.ll .tx.err { color: var(--err); }
.ll .vd { white-space: nowrap; color: var(--dim); }
.ll .vd.fired { color: var(--ok); font-weight: 700; }
.ll .vd.rate { color: var(--need-text); }
.ll.live .tx { color: var(--work); }
.ll.new { animation: flash 900ms ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } }
.lday { padding: 6px 18px 2px; color: var(--dim); font-size: 0.6875rem; }
.empty { margin: auto; max-width: 30rem; padding: 24px; text-align: center; color: var(--dim); font: 0.8125rem/1.5 -apple-system, system-ui, sans-serif; }
.empty b { display: block; color: var(--fg); font-size: 0.875rem; margin-bottom: 4px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; font-size: 0.8125rem; white-space: nowrap; }
.btn:hover { border-color: var(--dim); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.danger { background: var(--err); border-color: var(--err); color: light-dark(#fff, #1A0B0A); }
.btn kbd { font: 0.6875rem ui-monospace, monospace; opacity: .8; }
.appr { flex: none; margin: 0 12px 12px; padding: 12px 14px; border: 1.5px solid var(--need); border-radius: 10px; background: var(--panel); display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.appr .q { flex: 1; min-width: 14rem; }
.appr .q b { display: block; font-size: 0.875rem; }
.appr .q code { color: var(--dim); font-size: 0.75rem; }
.appr .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.quiet-bar { flex: none; margin: 0 12px 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.quiet-bar span { flex: 1; min-width: 14rem; color: var(--dim); }
.quiet-bar span b { color: var(--fg); }

.st { grid-column: 1 / -1; grid-row: 2; min-height: 26px; display: flex; align-items: center; gap: 16px; padding: 0 12px; border-top: 1px solid var(--line); background: var(--bg); font-size: 0.75rem; color: var(--dim); white-space: nowrap; overflow: hidden; }
.st .it { display: inline-flex; align-items: center; gap: 6px; }
.st .it b { color: var(--fg); font-weight: 600; }
.st .it .sd { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.st .it .sd.off { background: var(--dim); }
.st .sp { flex: 1; }
@container screen (width < 900px) { .st .opt { display: none; } }

/* ── Menus and dialog ── */
.menu { position: absolute; z-index: 20; min-width: 236px; padding: 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); box-shadow: 0 12px 32px rgba(0,0,0,.35); display: flex; flex-direction: column; }
.menu .mh { padding: 4px 10px 6px; font-size: 0.6875rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--dim); }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 30px; padding: 4px 10px; border-radius: 7px; }
.mi:hover, .mi:focus-visible { background: color-mix(in srgb, var(--accent) 18%, transparent); outline: none; }
.mi .ml { flex: 1; }
.mi .mk { font-size: 0.71875rem; color: var(--dim); }
.mi.danger { color: var(--err); }
.msep { height: 1px; margin: 4px 6px; background: var(--line); }
.scrim { position: absolute; inset: 0; z-index: 30; display: grid; place-items: start center; padding-top: 120px; background: color-mix(in srgb, #000 35%, transparent); }
.dlg { width: min(400px, calc(100% - 32px)); padding: 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); box-shadow: 0 20px 50px rgba(0,0,0,.45); display: grid; gap: 10px; }
.dlg h2 { margin: 0; font-size: 0.9375rem; }
.dlg p { margin: 0; color: var(--dim); }
.dlg .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

/* Design annotation (not app UI) */
.note { position: absolute; z-index: 9; right: 16px; bottom: 40px; width: min(330px, calc(100% - 280px)); border: 1.5px dashed var(--note-line); border-radius: 8px; background: var(--note); color: var(--fg); font-size: 0.75rem; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.note > button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 4px 10px; font-weight: 700; }
.note > button .k { margin-left: auto; font: 0.6875rem ui-monospace, monospace; color: var(--dim); }
.note .nbd { padding: 0 10px 10px; display: grid; gap: 6px; }
.note .nbd p { margin: 0; }
.note .nbd ul { margin: 0; padding-left: 16px; display: grid; gap: 3px; }
.note[data-closed] .nbd { display: none; }
.note .q { font-size: 0.6875rem; color: var(--dim); }
.note .btn { justify-self: start; min-height: 24px; font-size: 0.75rem; }
.app.has-appr .note { bottom: 120px; }
@container screen (width < 900px) { .note { width: min(300px, calc(100% - 252px)); } }
</style>

<section data-screen="main" data-title="1 · Main window: STREAMS above the footer"><div class="app" data-k="main"></div></section>
<section data-screen="log" data-title="2 · Clicked a stream: its log in the main pane"><div class="app" data-k="log"></div></section>

    restarting: ['buildkite restarting: a row comes out', '<p>The row slides out of the folded group with a turning blue ring and a live countdown. Not urgent, so no needs-you.</p><ul><li>When it reconnects the row says “running again” for a moment, then folds back in.</li></ul><button class="btn" data-act="replay">Replay</button>'],
    failing: ['slack failing: needs-you + a red row', '<p>After 7 restarts in 10 min midna raises a needs-you item, so the top pill goes from 1 to 2. The row is red; the header gets a red dot.</p><ul><li>⌘J or the pill opens slack’s log with the needs-you bar.</li><li>It keeps retrying every 5m; fixing the secret ends it.</li></ul>'],
    paused: ['calendar paused: still quiet', '<p>You paused it, so it isn’t trouble: no row comes out. The folded line says “2 running · 1 paused” so it can’t be forgotten.</p><ul><li>Unfold, or open calendar’s log, to Resume.</li></ul>'],
    approval: ['Agent added a stream: approve it', '<p>An agent in spike added github-notifications. It won’t start until you approve, so it raises needs-you (pill 1 → 2) and comes out amber.</p><ul><li>Approve/Deny sit at the bottom of its view, like a command approval.</li></ul>']
  };
  var LOG_NOTES = {
    healthy: ['Clicking a stream row', '<p>The main pane shows the stream, not a terminal: header with state and counts, what it runs, secrets by name, and one timeline of midna’s lines, stderr and events with their verdicts.</p><ul><li>Restart, Pause and More sit where a terminal’s tools sit.</li><li>Click a terminal row to go back.</li></ul>']
  };
  function note(k) {
    var n = (k === 'log' && LOG_NOTES[canvas.state]) || NOTES[canvas.state] || NOTES.healthy;
    return '<aside class="note" aria-label="Design note"' + (ui.noteClosed ? ' data-closed' : '') + '><button data-act="note" aria-expanded="' + !ui.noteClosed + '">' + n[0] + '<span class="k">N</span></button><div class="nbd">' + n[1] + '</div></aside>';
  }

  function menuHtml() {
    var m = ui.menu; if (!m) return '';
    var h = '<div class="menu" role="menu" aria-label="' + (m.kind === 'hd' ? 'Streams' : m.id) + '" style="left:' + m.x + 'px;top:' + m.y + 'px">';
    function it(act, label, key, extra) { return '<button class="mi' + (extra || '') + '" role="menuitem" data-act="' + act + '" data-id="' + (m.id || '') + '" tabindex="-1"><span class="ml">' + label + '</span>' + (key ? '<span class="mk">' + key + '</span>' : '') + '</button>'; }
    if (m.kind === 'hd') {
      h += it('fold', ui.open ? 'Fold streams' : 'Show all streams', '');
      h += it('triggers', 'Open Triggers', '');
      h += '<div class="msep"></div>' + it('hide', 'Hide from sidebar', 'show again from ⌘K');
    } else {
      var s = eff(m.id); if (!s) return '';
      h += '<div class="mh">' + m.id + '</div>';
      h += it('sel', 'Open log', '↩');
      if (s.st === 'approval') h += it('approve', 'Approve and start', '⌘↩');
      if (s.st === 'restarting') h += it('restart', 'Try now', '⇧⌘R');
      else if (s.st === 'failing' || s.st === 'running') h += it('restart', 'Restart', '⇧⌘R');
      if (s.st === 'paused') h += it('resume', 'Resume', '⇧⌘P');
      else if (s.st !== 'approval') h += it('pause', 'Pause', '⇧⌘P');
      h += it('copy', 'Copy command', '');
      h += '<div class="msep"></div>' + it('remove', 'Remove stream…', '', ' danger');
    }
    return h + '</div>';
  }
  function dialogHtml() {
    var d = ui.dialog; if (!d) return '';
    return '<div class="scrim" data-act="dlg-scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h2 id="dlg-t">Remove the ' + d.id + ' stream?</h2><p>midna stops it and forgets its command. Triggers that listen to it stay but get no events. Its secrets stay in Settings › Secrets.</p><div class="acts"><button class="btn" data-act="dlg-cancel" data-f="d:cancel">Cancel</button><button class="btn danger" data-act="dlg-remove" data-id="' + d.id + '" data-f="d:remove">Remove ' + d.id + '</button></div></div></div>';
  }

  /* ── Render ── */
  function appFor(k) {
    var sel = ui.sel[k], s = isStream(sel) ? eff(sel) : null;
    if (isStream(sel) && !s) { ui.sel[k] = 'build-angel'; sel = 'build-angel'; }
    var pane = s ? streamPane(s) : termPane(sel);
    var h = sidebar(k) + pane + statusBar() + note(k);
    if (canvas.screen === k) h += menuHtml() + dialogHtml();
    return h;
  }
  function render() {
    var ae = canvas.root.activeElement, fk = ae && ae.getAttribute && ae.getAttribute('data-f');
    var lgEls = canvas.$$('.lg'), keepScroll = {};
    lgEls.forEach(function (el) { var k = el.closest('.app').getAttribute('data-k'); keepScroll[k] = el.scrollHeight - el.scrollTop - el.clientHeight < 4; });
    canvas.$$('.app').forEach(function (app) {
      var k = app.getAttribute('data-k');
      app.innerHTML = appFor(k);
      var s = isStream(ui.sel[k]) && eff(ui.sel[k]);
      app.classList.toggle('has-appr', !!(s && (s.st === 'failing' || s.st === 'approval' || s.st === 'paused')));
      var lg = app.querySelector('.lg[role=log]');
      if (lg && keepScroll[k] !== false) lg.scrollTop = lg.scrollHeight;
    });
    ui.entering = {}; ui.unfolding = false; ui.lastNeed = needCount();
    var cur = canvas.$('[data-screen="' + canvas.screen + '"] .app');
    if (ui.menu && cur) {
      var mn = cur.querySelector('.menu');
      if (mn) {
        var W = cur.clientWidth, H = cur.clientHeight;
        if (ui.menu.up) mn.style.top = Math.max(8, ui.menu.y - mn.offsetHeight - 4) + 'px';
        if (ui.menu.right) mn.style.left = Math.max(8, ui.menu.x - mn.offsetWidth) + 'px';
        if (mn.offsetLeft + mn.offsetWidth > W - 8) mn.style.left = (W - 8 - mn.offsetWidth) + 'px';
        if (mn.offsetTop + mn.offsetHeight > H - 8) mn.style.top = Math.max(8, H - 8 - mn.offsetHeight) + 'px';
        var first = mn.querySelector('.mi'); if (first) first.focus();
      }
    } else if (ui.dialog && cur) {
      var c = cur.querySelector('[data-f="d:cancel"]'); if (c) c.focus();
    } else if (fk && cur) {
      var el = cur.querySelector('[data-f="' + fk + '"]'); if (el) el.focus();
    }
    canvas.refresh();
  }

  /* ── Countdowns and the restart → recovery transition ── */
  var timers = [];
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  setInterval(function () {
    if (!ui) return;
    if (canvas.state === 'restarting' && ui.phase === 'wait' && !ui.ov.buildkite) {
      ui.cd--;
      if (ui.cd <= 0) { tryNowBuildkite(); return; }
      canvas.$$('[data-cd="r"]').forEach(function (e) { e.textContent = mmss(ui.cd); });
    }
    if (canvas.state === 'failing' && eff('slack') && eff('slack').st === 'failing') {
      ui.fcd = ui.fcd <= 1 ? 300 : ui.fcd - 1;
      canvas.$$('[data-cd="f"]').forEach(function (e) { e.textContent = mmss(ui.fcd); });
    }
  }, 1000);
  function tryNowBuildkite() {
    ui.phase = 'connecting'; render();
    later(function () { ui.phase = 'recovered'; render(); }, 1400);
    later(function () {
      var shown = ui.open || ui.sel[canvas.screen] === 'buildkite';
      if (shown) { ui.phase = 'done'; render(); return; }
      ui.leaving = 'buildkite'; ui.phase = 'done'; render();
      later(function () { ui.leaving = null; render(); }, 260);
    }, 4400);
  }
  function startState() {
    clearTimers();
    reset();
    if (canvas.state === 'restarting') ui.entering.buildkite = true;
    if (canvas.state === 'failing') ui.entering.slack = true;
    if (canvas.state === 'approval') ui.entering['github-notifications'] = true;
    ui.lastNeed = 1;
    render();
  }

  /* ── Actions ── */
  function addLine(id, line) { (ui.extra[id] = ui.extra[id] || []).push(line); }
  function nowT() { return '12:46:' + String(10 + Math.floor(Math.random() * 40)); }
  function select(id) {
    ui.menu = null;
    if (isStream(id)) {
      ui.sel.log = id;
      if (canvas.screen !== 'log') { canvas.navigate('log'); return; }
    } else {
      ui.sel.main = id;
      if (canvas.screen !== 'main') { canvas.navigate('main', { replace: true }); return; }
    }
    render();
  }
  function act(a, id, el) {
    var s = id && eff(id);
    switch (a) {
      case 'sel': select(id); return;
      case 'fold': ui.menu = null; ui.open = !ui.open; ui.unfolding = ui.open; render(); return;
      case 'hide': ui.menu = null; ui.hidden = true; render(); canvas.toast('Streams hidden from the sidebar. ⌘K “Show streams” brings them back. They keep running and failures still reach needs-you.', 5000); return;
      case 'triggers': ui.menu = null; render(); canvas.toast('Opens the Triggers screen (overlay in this window)'); return;
      case 'pill':
        var f = streams().filter(function (x) { return x.st === 'failing' || x.st === 'approval'; })[0];
        select(f ? f.id : 'spike'); return;
      case 'restart':
        ui.menu = null;
        if (id === 'buildkite' && canvas.state === 'restarting' && ui.phase === 'wait' && !ui.ov.buildkite) { tryNowBuildkite(); return; }
        if (s.st === 'failing') {
          addLine(id, L(nowT(), 'midna', 'restart by you · started · pid 49012'));
          addLine(id, L(nowT(), 'stderr', '[ERROR] socket-mode: An API error occurred: invalid_auth', '', 'err'));
          addLine(id, L(nowT(), 'midna', 'exited 1 · still failing · next try in 5m'));
          ui.fcd = 300; render(); canvas.toast('slack failed again: invalid_auth'); return;
        }
        ui.ov[id] = Object.assign({}, ui.ov[id], { st: 'running', restarts: (s.restarts || 0) + 1 });
        addLine(id, L(nowT(), 'midna', (s.st === 'paused' ? 'started by you' : 'restarted by you') + ' · pid 49' + Math.floor(100 + Math.random() * 800)));
        render(); canvas.toast((s.st === 'paused' ? 'Started ' : 'Restarted ') + id); return;
      case 'pause':
        ui.menu = null;
        ui.ov[id] = Object.assign({}, ui.ov[id], { st: 'paused', by: 'you', at: '12:46' });
        addLine(id, L(nowT(), 'midna', 'paused by you · stopped'));
        render(); canvas.toast('Paused ' + id + (s.st === 'failing' ? '. Its needs-you item is cleared.' : '')); return;
      case 'resume':
        ui.menu = null;
        ui.ov[id] = Object.assign({}, ui.ov[id], { st: 'running' });
        addLine(id, L(nowT(), 'midna', 'resumed by you · started · pid 49233'));
        render(); canvas.toast('Resumed ' + id); return;
      case 'approve':
        ui.menu = null;
        ui.ov[id] = Object.assign({}, ui.ov[id], { st: 'running', last: 'just now', count: 0 });
        addLine(id, L(nowT(), 'midna', 'approved by you · started · pid 49301'));
        addLine(id, L(nowT(), 'stderr', 'polling notifications every 60s'));
        render(); canvas.toast('github-notifications approved and started'); return;
      case 'deny':
        ui.removed[id] = true; ui.menu = null; render(); canvas.toast('Denied. github-notifications was removed; spike is told.'); return;
      case 'copy': ui.menu = null; render(); canvas.toast('Copied: ' + s.cmd); return;
      case 'secrets': canvas.toast('Opens Settings › Secrets (its own window) on SLACK_APP_TOKEN'); return;
      case 'remove': ui.menu = null; ui.dialog = { id: id, back: id }; render(); return;
      case 'dlg-cancel': var b = ui.dialog && ui.dialog.back; ui.dialog = null; render(); focusRow(b); return;
      case 'dlg-remove': ui.dialog = null; ui.removed[id] = true; render(); canvas.toast('Removed the ' + id + ' stream'); return;
      case 'more': openMenu('row', id, el, true); return;
      case 'filter': ui.filter = el.getAttribute('data-v'); render(); return;
      case 'note': ui.noteClosed = !ui.noteClosed; render(); return;
      case 'replay': startState(); return;
    }
  }
  function focusRow(id) { var cur = canvas.$('[data-screen="' + canvas.screen + '"] .app'); var el = cur && cur.querySelector('[data-f="row:' + id + '"]'); if (el) el.focus(); }

  function openMenu(kind, id, el, fromButton, pt) {
    var cur = el.closest('.app'), ar = cur.getBoundingClientRect(), sc = ar.width / cur.offsetWidth;
    var r = el.getBoundingClientRect(), m = { kind: kind, id: id, back: el.getAttribute('data-f') };
    if (pt) { m.x = (pt.x - ar.left) / sc; m.y = (pt.y - ar.top) / sc; }
    else if (fromButton) { m.x = (r.right - ar.left) / sc; m.y = (r.bottom - ar.top) / sc + 4; m.right = true; }
    else { m.x = (r.left - ar.left) / sc + 24; m.y = (r.top - ar.top) / sc; m.up = true; }
    if (kind === 'hd' && !pt) { m.x = (r.left - ar.left) / sc + 8; m.y = (r.top - ar.top) / sc; m.up = true; }
    if (pt && kind === 'hd') m.up = true;
    if (pt && kind === 'row') m.up = (r.top - ar.top) / sc > cur.offsetHeight * 0.55;
    ui.menu = m; render();
  }
  function closeMenu() {
    var back = ui.menu && ui.menu.back; ui.menu = null; render();
    var cur = canvas.$('[data-screen="' + canvas.screen + '"] .app'); var el = back && cur && cur.querySelector('[data-f="' + back + '"]'); if (el) el.focus();
  }

  var root = canvas.root;
  root.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (ui.menu && !e.target.closest('.menu')) { var hadMenu = true; ui.menu = null; if (!t || t.getAttribute('data-act') === 'more') { render(); return; } }
    if (!t) return;
    var a = t.getAttribute('data-act');
    if (a === 'dlg-scrim') { if (e.target === t) act('dlg-cancel'); return; }
    act(a, t.getAttribute('data-id'), t);
  });
  root.addEventListener('contextmenu', function (e) {
    var row = e.target.closest('[data-sid]'), hd = e.target.closest('.ghd');
    if (!row && !hd) return;
    e.preventDefault();
    openMenu(row ? 'row' : 'hd', row ? row.getAttribute('data-sid') : null, row || hd, false, { x: e.clientX, y: e.clientY });
  });
  root.addEventListener('keydown', function (e) {
    var t = e.target;
    if (ui.dialog) {
      if (e.key === 'Escape') { e.preventDefault(); act('dlg-cancel'); return; }
      if (e.key === 'Tab') { var bs = canvas.$$('.dlg button'); var i = bs.indexOf ? bs.indexOf(t) : Array.prototype.indexOf.call(bs, t); e.preventDefault(); bs[(i + (e.shiftKey ? bs.length - 1 : 1)) % bs.length].focus(); }
      return;
    }
    if (ui.menu) {
      var items = Array.prototype.slice.call(canvas.$$('.menu .mi')), ix = items.indexOf(t);
      if (e.key === 'Escape') { e.preventDefault(); closeMenu(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); items[(ix + 1) % items.length].focus(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); items[(ix - 1 + items.length) % items.length].focus(); return; }
      if (e.key === 'Home') { e.preventDefault(); items[0].focus(); return; }
      if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); return; }
      if (e.key === 'Tab') { e.preventDefault(); closeMenu(); return; }
      return;
    }
    if (e.key === 'ContextMenu' || (e.key === 'F10' && e.shiftKey)) {
      var row = t.closest && t.closest('[data-sid]'), hd = t.closest && t.closest('.ghd');
      if (row || hd) { e.preventDefault(); openMenu(row ? 'row' : 'hd', row ? row.getAttribute('data-sid') : null, row || hd, false); }
      return;
    }
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && t.hasAttribute && t.hasAttribute('data-nav-row')) {
      var list = Array.prototype.slice.call(t.closest('.sb').querySelectorAll('[data-nav-row]')), j = list.indexOf(t);
      var nx = list[j + (e.key === 'ArrowDown' ? 1 : -1)]; if (nx) { e.preventDefault(); nx.focus(); }
      return;
    }
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && t.getAttribute && t.getAttribute('role') === 'radio') {
      var rs = Array.prototype.slice.call(t.parentNode.children), k = rs.indexOf(t);
      var n2 = rs[(k + (e.key === 'ArrowRight' ? 1 : rs.length - 1)) % rs.length]; e.preventDefault(); ui.filter = n2.getAttribute('data-v'); render(); return;
    }
    if (e.key === 'ArrowLeft' && t.classList && t.classList.contains('ghd') && ui.open) { e.preventDefault(); act('fold'); return; }
    if (e.key === 'ArrowRight' && t.classList && t.classList.contains('ghd') && !ui.open) { e.preventDefault(); act('fold'); return; }
    var sid = isStream(ui.sel[canvas.screen]) && ui.sel[canvas.screen], s = sid && eff(sid);
    if (canvas.screen === 'log' && s && e.metaKey) {
      if (s.st === 'approval' && e.key === 'Enter') { e.preventDefault(); act('approve', sid); return; }
      if (s.st === 'approval' && e.key === 'Backspace') { e.preventDefault(); act('deny', sid); return; }
      if (e.shiftKey && (e.key === 'r' || e.key === 'R') && s.st !== 'approval') { e.preventDefault(); act('restart', sid); return; }
      if (e.shiftKey && (e.key === 'p' || e.key === 'P') && s.st !== 'approval') { e.preventDefault(); act(s.st === 'paused' ? 'resume' : 'pause', sid); return; }
    }
    if (e.metaKey && (e.key === 'j' || e.key === 'J')) { e.preventDefault(); act('pill'); return; }
    if ((e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey && !e.altKey) { act('note'); return; }
  });

  canvas.onState(function () { startState(); });
  canvas.onNavigate(function () { ui.menu = null; ui.dialog = null; render(); });
};
</script>
